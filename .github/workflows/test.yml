name: Acceptance Tests

on:
  # The Partner program requires the provider's tests to run nightly.
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# The suite creates and destroys resources in a shared project, so two runs
# must not interleave. Queue them rather than cancelling: a cancelled run
# leaves its resources behind.
concurrency:
  group: acceptance-tests
  cancel-in-progress: false

env:
  # Pinned deliberately. The compose file defaults to :latest, and a nightly
  # job must not start failing because upstream published a release overnight.
  APPWRITE_VERSION: "2.2.0"

jobs:
  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # terraform-plugin-testing otherwise falls back to downloading Terraform
      # through hc-install, which currently fails verifying the release
      # checksums ("openpgp: key expired"). Pointing it at the binary
      # setup-terraform already installed skips that path entirely.
      - name: Pin Terraform binary for the test framework
        run: echo "TF_ACC_TERRAFORM_PATH=$(which terraform)" >> "$GITHUB_ENV"

      - name: Start Appwrite
        run: .github/scripts/appwrite-up.sh

      - name: Bootstrap Appwrite project and credentials
        run: .github/scripts/appwrite-bootstrap.sh

      - name: Run acceptance tests
        run: make acceptance-test
        timeout-minutes: 30
        env:
          TF_ACC: "1"

      # Without these a nightly failure is undiagnosable: the test output shows
      # an HTTP error, and the reason for it is only in the server logs.
      - name: Collect Appwrite logs
        if: failure()
        run: |
          mkdir -p appwrite-logs
          for c in $(docker ps --format '{{.Names}}'); do
            docker logs "$c" > "appwrite-logs/${c}.log" 2>&1 || true
          done

      - name: Upload Appwrite logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: appwrite-logs
          path: appwrite-logs/
          retention-days: 7
