name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Nothing in this workflow writes to the repository,
# and a job that needs more should ask for it rather than inherit it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Every tool version lives here so a floating tag cannot change what passes
  # review. The linter is deliberately not @latest: CI used to install the v1
  # module path, whose @latest is the end-of-life v1.64.8.
  GOLANGCI_LINT_VERSION: v2.13.2
  ACTIONLINT_VERSION: v1.7.12
  GOVULNCHECK_VERSION: v1.8.0
  ZIZMOR_VERSION: 1.30.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o terraform-provider-appwrite .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: make vet
      - name: Check formatting
        run: make fmt-check
      - name: golangci-lint
        run: make golangci-lint
        env:
          GOLANGCI_LINT_VERSION: ${{ env.GOLANGCI_LINT_VERSION }}

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Short timeout on purpose: nothing in the unit suite may touch the
      # network, and a deadline is the only structural way to enforce that.
      - name: Run unit tests
        run: make test

  checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # The example-formatting check skips itself when terraform is missing so a
      # developer without it can still run `make checks`. This makes that
      # impossible here.
      - name: Run repository checks
        run: make checks
        env:
          REQUIRE_TERRAFORM: "1"

      - name: go.mod is tidy
        run: make depscheck

      # Sweeper code deletes infrastructure with no plan in front of it. These
      # assert it reaches the test binary and not the release binary.
      - name: Sweepers are linked into tests
        run: make sweeper-linked
      - name: Sweepers are absent from the release binary
        run: make sweeper-unlinked

  docs:
    name: Docs Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Generate docs and check for a diff
        run: make docs-check

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Reports only vulnerabilities on a code path the provider actually
      # reaches, so it is quiet enough to gate on rather than advisory.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Installed as tools rather than as third-party actions on purpose: an
      # action would be one more SHA to pin and one more supply-chain edge for a
      # job whose entire job is checking the supply chain.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_VERSION}" -color

      # zizmor finds Actions-specific security problems actionlint does not:
      # injectable ${{ }} interpolation into run blocks, over-broad permissions,
      # unpinned actions, dangerous triggers.
      - name: zizmor
        run: |
          pipx install "zizmor==${ZIZMOR_VERSION}"
          # --offline keeps the run deterministic and tokenless. The online
          # audits check whether a pinned action SHA still exists upstream,
          # which is a useful thing to know but not a reason for CI to fail on
          # a pull request that did not touch workflows.
          zizmor --offline --persona=regular .github/workflows/

      - name: shellcheck the CI scripts
        run: shellcheck .github/scripts/*.sh scripts/*.sh scripts/checks/*.sh

  changelog:
    name: Changelog Entry
    # Only meaningful on a pull request: a push to main has no PR to inspect.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Needs the base commit to diff against.
          fetch-depth: 0

      # A user-visible change with no changelog entry is a change nobody outside
      # this repository will ever hear about. The escape hatch is a label rather
      # than a convention in the description, so that skipping it is a visible,
      # attributable act.
      - name: Require a changelog entry or the skip-changelog label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if printf '%s' "$LABELS" | grep -q '"skip-changelog"'; then
            echo "skip-changelog label is present; not requiring an entry."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated."
            exit 0
          fi
          echo "::error::This pull request does not touch CHANGELOG.md."
          echo
          echo "Add an entry describing the change from a user's point of view, or apply the"
          echo "skip-changelog label if it genuinely changes nothing a user would notice"
          echo "(internal refactors, CI, tests)."
          exit 1

  # One job to require in branch protection. Without it, adding a job above
  # means remembering to add it to the required list, and forgetting means the
  # new check never actually gates anything.
  check:
    name: CI
    if: always()
    needs: [build, lint, unit-test, checks, docs, vulncheck, workflow-lint, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for result in $results; do
            # "skipped" is allowed: the changelog job does not run on a push to
            # main, and treating that as a failure would make every merge red.
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
