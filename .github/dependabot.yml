version: 2

updates:
  # sdk-for-go ships breaking changes in minor releases, so it gets a PR of its
  # own rather than riding along with the rest of the module updates.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      appwrite:
        patterns:
          - github.com/appwrite/*
      go-modules:
        patterns:
          - "*"
        exclude-patterns:
          - github.com/appwrite/*

  # Workflows pin actions to a commit SHA; Dependabot keeps the SHA and the
  # version comment beside it in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
